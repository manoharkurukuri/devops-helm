apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fullstack-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/manoharkurukuri/devops-helm.git
    targetRevision: main
    path: kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-app-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true