{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fullstack.fullname" . }}-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ include "fullstack.fullname" . }}-gateway
      sectionName: http
    - name: {{ include "fullstack.fullname" . }}-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/runtime-config
        - path:
            type: Exact
            value: /api/config
      backendRefs:
        - name: {{ include "fullstack.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "fullstack.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "fullstack.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}
{{- end }}
