apiVersion: v1
kind: Service
metadata:
  name: {{ include "fullstack.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "fullstack.fullname" . }}-backend
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: http
