apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: notes-ca-issuer
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: notes-local-ca-key